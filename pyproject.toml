[project]
name = "bodai"
version = "0.1.0"
description = "The Orb - Ecosystem meta-project for Bodai"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "oneiric>=0.2.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "textual>=0.40.0",
    "ipython>=8.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
bodai = "bodai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "crackerjack>=0.54.0",
]
