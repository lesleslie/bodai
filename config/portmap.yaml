# Bodai Ecosystem Port Allocation
# MCP servers: 8676-8699 (core), 3030-3049 (MCP integrations)

mcp_core_range:
  start: 8676
  end: 8699

mcp_integration_range:
  start: 3030
  end: 3049

allocations:
  # Core MCP servers (8676-8699)
  8676: crackerjack    # Inspector
  8678: session-buddy  # Builder
  8680: mahavishnu     # Orchestrator
  8681: available      # (Oneiric MCP absorbed into Druva)
  8682: akosha         # Seer
  8683: druva         # Curator

  # MCP Integration servers (3030-3049)
  3030: grafana-mcp        # Grafana dashboards (external plugin)
  3031: excalidraw-mcp     # Excalidraw diagram collaboration
  3032: available          # Reserved
  3033: mermaid-mcp        # Mermaid diagrams (external)
  3034: raindropio-mcp     # Raindrop.io bookmark management
  3035: grafana            # Grafana server (main instance)
  3036: chart-antv         # Chart visualization (external)
  3037: opera-cloud-mcp    # Oracle OPERA Cloud API
  3038: unifi-mcp          # UniFi network management
  3039: mailgun-mcp        # Mailgun email service
  3040: graphics-mcp       # Graphics manipulation (Pillow/pilkit)
  3041: available          # Reserved
  3042: porkbun-dns-mcp    # Porkbun DNS management
  3043: porkbun-domain-mcp # Porkbun domain management
  3044: n8n-mcp            # n8n workflow automation
  3045: neo4j-mcp          # Neo4j graph database
  3046: synxis-crs-mcp     # SynXis Central Reservation System
  3047: synxis-pms-mcp     # SynXis Property Management System
  3048: langsmith-mcp      # LangSmith tracing/observability
  3049: css-mcp            # CSS analysis and documentation

reserved:
  8684-8699: future expansion (core)
  3050-3059: future expansion (integrations)
