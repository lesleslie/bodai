# Bodai Ecosystem Port Allocation
# MCP servers: 8676-8699 (core), 3030-3069 (MCP integrations)

mcp_core_range:
  start: 8676
  end: 8699

mcp_integration_range:
  start: 3030
  end: 3069

allocations:
  # Core MCP servers (8676-8699)
  8676: crackerjack    # Inspector
  8678: session-buddy  # Builder
  8680: mahavishnu     # Orchestrator
  8681: available      # (Oneiric MCP absorbed into Dhara)
  8682: akosha         # Seer
  8683: dhara          # Curator
  8684: crackerjack    # Crackerjack dashboard_port (was fastblocks, now correct)
  8685: crackerjack    # Crackerjack zuban_port (was mdinject, now correct)
  8686: available      # Available (core range; reserved block removed 2026-09-21)
  8696: crackerjack    # Crackerjack mcp_websocket_port

  # MCP Integration servers (3030-3049)
  3030: grafana-mcp        # Grafana dashboards (external plugin)
  3031: excalidraw-mcp     # Excalidraw diagram collaboration
  3032: available          # Reserved
  3033: retired            # Was mermaid-mcp; uninstalled 2026-09-09
  3034: raindropio-mcp     # Raindrop.io bookmark management
  3035: grafana            # Grafana server (main instance)
  3036: chart-antv         # Chart visualization (external)
  3037: opera-cloud-mcp    # Oracle OPERA Cloud API
  3038: unifi-mcp          # UniFi network management
  3039: mailgun-mcp        # Mailgun email service
  3040: graphics-mcp       # Graphics manipulation (Pillow/pilkit)
  3041: available          # Reserved
  3042: porkbun-dns-mcp    # Porkbun DNS management
  3043: porkbun-domain-mcp # Porkbun domain management
  3044: available          # (n8n-mcp disabled 2026-09-06)
  3045: neo4j-mcp          # Neo4j graph database
  3046: synxis-crs-mcp     # SynXis Central Reservation System
  3047: synxis-pms-mcp     # SynXis Property Management System
  3048: langsmith-mcp      # LangSmith tracing/observability
  3049: available         # Reserved (css-mcp actually binds 3050)

  # Additional MCP integrations (3050-3069)
  3050: css-mcp           # CSS analysis and documentation (was 3049)
  3051: penpot-api-mcp    # Penpot design platform API
  3052: spline-mcp        # Spline.design 3D scene orchestration (was 3050)
  3053: available         # Reserved
  3054: archive-org-mcp   # Internet Archive Wayback and catalog (Plan 0a)
  3055: medium-mcp        # Medium content via the unofficial medium2 API
  3056: scapy-mcp         # Scapy packet crafting, dissection, capture
  3057: chat-bridge-mcp   # 2026-09-21 — Cross-app bridge (Claude Desktop ↔ ChatGPT Desktop via CDP)
  3058: available         # 2026-09-21 — No longer reserved
  3059: available         # 2026-09-21 — No longer reserved
  3060: available         # 2026-09-21 — First slot in the extended integration range
  3061: cmux-mcp          # 2026-09-21 — Terminal automation (programmatic cmux instance control)

  # Out-of-range but actively bound ports (tracked for collision safety)
  # 3000: was session-buddy non-MCP server_port — removed 2026-09-21. The
  #       `server_port: 3000` override in settings/session-buddy.yaml was
  #       a dead config field: no production code reads `.server_port`
  #       (the MCP listener uses `http_port`, default 8678), and the bare
  #       `SessionMgmtSettings()` schema default is also 8678, not 3000.
  #       Freeing 3000 removes a phantom reservation that could collide
  #       with any new dev server (CRA/Rails/Jekyll/Grafana legacy/etc.)
  #       that defaults to 3000.
  3002: akosha           # Akosha MCP port (distinct from api_port 8682)
  8679: mdinject         # Markdown injection and content healing
  8765: session-buddy    # Session-Buddy WebSocket
  9090: akosha           # Akosha Prometheus metrics exporter
  1883: oneiric          # Oneiric MQTT broker (standard port)

# Reserved block removed 2026-09-21: user confirmed 3057-3059 and 8697-8699 are
# no longer held aside. Future ports are allocated from the open slots listed
# under the integrations block (or requested via PR when core-range additions
# are needed).
