# Bodai Ecosystem Port Allocation
# MCP servers: 8676-8699 (core), 3030-3049 (MCP integrations)
# Adjacent infrastructure (8675, 8765) is tracked here so port audits catch
# collisions across the whole Bodai host, not just MCP servers.

mcp_core_range:
  start: 8676
  end: 8699

mcp_integration_range:
  start: 3030
  end: 3049

allocations:
  # Infrastructure (adjacent to MCP core range; tracked for collision audits)
  8675: prefect             # Prefect API uvicorn (workflow backend)
  8676: crackerjack         # Inspector
  8678: session-buddy       # Builder (MCP server)
  8680: mahavishnu          # Orchestrator
  8681: reserved-oneiric    # Oneiric MCP absorbed into Dhara; port reserved
  8682: akosha              # Seer
  8683: dhara               # Curator (formerly "Druva" in this file)
  8693: bodai-crow          # Browser/automation MCP bridge
  8765: session-buddy-ws    # Session-Buddy WebSocket (real-time metrics)

  # Reserved (within MCP core range)
  8684: reserved            # (previously listed "fastblocks" — not a Bodai component)
  8685: reserved            # (previously listed "mdinject" — not a Bodai component)

  # MCP Integration servers (3030-3049)
  3030: grafana-mcp        # Grafana dashboards (external plugin)
  3031: excalidraw-mcp     # Excalidraw diagram collaboration
  3032: available          # Reserved
  3033: mermaid-mcp        # Mermaid diagrams (external)
  3034: raindropio-mcp     # Raindrop.io bookmark management
  3035: grafana            # Grafana server (main instance)
  3036: chart-antv         # Chart visualization (external)
  3037: opera-cloud-mcp    # Oracle OPERA Cloud API
  3038: unifi-mcp          # UniFi network management
  3039: mailgun-mcp        # Mailgun email service
  3040: graphics-mcp       # Graphics manipulation (Pillow/pilkit)
  3041: available          # Reserved
  3042: porkbun-dns-mcp    # Porkbun DNS management
  3043: porkbun-domain-mcp # Porkbun domain management
  3045: neo4j-mcp          # Neo4j graph database
  3046: synxis-crs-mcp     # SynXis Central Reservation System
  3047: synxis-pms-mcp     # SynXis Property Management System
  3048: langsmith-mcp      # LangSmith tracing/observability
  3049: css-mcp            # CSS analysis and documentation

  # Internal Bodai observability surfaces (WebSocket push channels)
  8471: bifrost            # Bifrost LLM gateway (bifrost-http-0)
  8686: crackerjack-ws     # Crackerjack Test Execution WebSocket
  8690: mahavishnu-ws      # Mahavishnu workflow events WebSocket
  8691: mahavishnu-pool-ws # Mahavishnu Pool status WebSocket
  8692: akosha-ws          # Akosha pattern detection WebSocket
  8699: web_reader         # web_reader webpage ingestion MCP
  8765: session-buddy-ws   # Session-Buddy WebSocket (peer process; runs alongside 8678)

reserved:
  8684, 8693-8698: future expansion (core)
  3050-3059: future expansion (integrations)
